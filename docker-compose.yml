# Local run: cp .env.example .env && docker compose up --build
# Then: curl http://localhost:5000/info
services:
  app:
    build: ./app
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-5000}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
